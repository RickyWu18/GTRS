    label_prefix: "D-"
    pdf_start: 495
    count: 42               # D-1 – D-42　符號說明列表

  - kind: back_matter
    label_format: none
    pdf_start: 537
    count: 2                # Report Documentation Page ＋ 空白頁

# ─────────────────────────────────────────────────────────────
# 掃描影像規格　W0.6 抽樣後回填
# 全部欄位填妥前不得開始批次轉檔（WBS W1.3）。
# deskew / crop / rotate 一旦中途變更，全本既有 bbox 座標全部作廢。
#
# 前提：來源 PDF 的 538 頁中，536 頁已是 1-bit 雙階 PNG（6600×5088，恰為
# 600 dpi，以旋轉矩陣置於直向頁），另 2 頁為 300 dpi 8-bit JPEG。
# 二值化在 2011 年製作此 PDF 時即已完成，**本專案無灰階母本可用**，
# 故 method 非「我們採取的作法」而是「來源既成事實」，binarize_algo 無對象可施。
# 連帶：WBS W1.4「例外頁改以灰階重轉」對該 536 頁不可行。
# ─────────────────────────────────────────────────────────────
scan_spec:
  method: bilevel-from-source   # 沿用來源雙階，不另行二值化
  dpi: 600                      # 等同來源原生解析度，無重新取樣
  format: webp-lossless         # 全本約 75 MB；線稿用有損編碼體積反而漲 4.4 倍
  binarize_algo: none
  deskew: false                 # 抽樣 10 頁中 7 頁為 0.00°，最差 0.90°；
                                # 對 1-bit 影像重新取樣不是灰階化就是再二值化，收益不抵損失
  crop: none                    # 裝訂孔黑點壓在頁緣（墨界 0.000–0.998），
                                # auto-margin 會逐頁不同，使相對 bbox 在頁間不可比
  rotate: none
  exceptions: [1, 11, 537]      # 1、537：300 dpi 8-bit JPEG，走另一路徑
                                # 11：來源整頁全黑，內容不可回復，待另尋來源或標 illegible
  decided_by: "Ricky Wu"
  decided_on: 2026-09-16
  master_location: "source/CR-166536.pdf（本機，未進版控）；600 dpi 母本按需自 PDF 抽出，不另存逐頁檔"
  master_sha256: a2013a314af5beb0c5e9bc5bbeb26f99be9a8aa63f2ebe07deaaf11d0d44d67d
