#    帶星號與「現行 Sigma 8 模型」但書，是否另有 7B 未確認。
# 兩者推測與 Rev. A 增補有關，但原文未說明，故不補全。
#
# 頁型統計見 work/section_breaks.json（由 tools/section_scan.py 產生）。
