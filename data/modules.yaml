#
# ── 本檔目前的狀態 ────────────────────────────────────────────
# 骨架取自 W0.3／W0.4 的結構盤點：附錄 A（pdf 69–350）依 subsystem 分為 27 個區塊，
# 各區塊的編號、原文名稱與頁範圍均為實測。`inputs`／`outputs`／`states`／`couples_to`
# 一律留空——那些內容在各區塊的「方框摘要頁」上（見 io_summary_pages），
# 尚未轉錄。留空不代表該模組無耦合。
#
# status: draft —— 目視判讀，未逐字對照核對（計畫書 9.5）。
#
# ── id 的取法 ────────────────────────────────────────────────
# id 直接採原文的 subsystem 編號（含 `8a`、`10b` 等細分），未自行改寫為語意化名稱，
# 以符合 WBS W2.3「scope 直接取 subsystem id，未自行分類」。symbols.yaml 的 scope
# 應使用同一組字串。
#
# ── 兩處與正文目錄不一致，據實記錄，未調和 ──────────────────
# 1. 正文目錄（印刷 v–vi）只列 subsystem 1–19；附錄 A 實際含 subsystem 20
