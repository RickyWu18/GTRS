# 模組定義與輸入輸出埠（相依關係圖 F7 之資料來源）
# 依據：計畫書 5.5　│　工項：WBS W5.2
#
# ── 本檔目前的狀態 ────────────────────────────────────────────
# 骨架取自 W0.3／W0.4 的結構盤點，並於 2026-09-25（W2.2 期間）全面重新驗證。
# 附錄 A（pdf 69–350）依 subsystem 分為 29 個區塊，編號、原文名稱與頁範圍均為實測。
# `inputs`／`outputs`／`states`／`couples_to` 一律留空——那些內容在各區塊的符號表頁上
# （見 io_summary_pages），尚未轉錄。留空不代表該模組無耦合。
#
# status: draft —— 目視判讀，未逐字對照核對（計畫書 9.5）。
#
# ── 2026-09-25 重新驗證：三項更正 ─────────────────────────────
# 驗證方式：以 tools/strip_sheet.py 將 pdf 69–350 全部 282 頁的頁首條帶拼版，
# 逐頁目視判別頁型。附錄 A 的頁型固定輪替（見 tools/section_scan.py 檔首）：
#   方框摘要頁 → 符號表頁（頁首左對齊 `SUBSYSTEM NO. n:`）→ 公式頁（頁首置中 `EQUATIONS`）
#
# 1. 新增 subsystem 7B（pdf 185–190）。原檔註解已標記「是否另有 7B 未確認」，
#    此次確認存在：pdf 185 方框頁標題為 `7B  LANDING GEAR (Unused Bell Model)`。
#    連帶 7A 的範圍由 171–190 更正為 171–184。
# 2. 新增 subsystem 10f（pdf 266–269，AXES TRANSFORMATION (GROUND REFERENCE DISTANCES)）。
#    原檔僅列 10a–10e，10e 的範圍 263–269 把 10f 整個吞掉，更正為 263–265。
# 3. io_summary_pages 全面重算。原值只收了方框頁，漏掉其後無方框的符號表續頁；
#    29 個 subsystem 全部受影響，合計由 44 頁更正為 134 頁。
#    例：subsystem 11 原記 [270, 271]，實為 270–274 共 5 頁（275 起才是公式頁）。
#
# ── id 的取法 ────────────────────────────────────────────────
# id 直接採原文的 subsystem 編號（含 `8a`、`10b` 等細分），未自行改寫為語意化名稱，
# 以符合 WBS W2.3「scope 直接取 subsystem id，未自行分類」。symbols.yaml 的 scope
# 應使用同一組字串。
#
# ── 與正文目錄不一致之處，據實記錄，未調和 ──────────────────
# 正文目錄（印刷 v–vi）只列 subsystem 1–19；附錄 A 實際含 subsystem 20
# （STABILITY AND CONTROL AUGMENTATION SYSTEM），且有目錄未列的 7A／7B、8a–8d、
# 10a–10f 細分。推測與 Rev. A 增補有關，但原文未說明，故不補全。
#
# equation_pages 為「首行置中」的頁數，圖版頁亦會計入，故為上界估計。
# 此次重新驗證未重算該欄，僅為新增的 7B（3）與 10f（1）填入實測值。

