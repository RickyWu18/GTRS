# 逐頁處理狀態台帳
# 依據：計畫書 5.9　│　工項：WBS W1.7（腳本）、W3.5（全本初始化）
#
# status 記錄於公式層級，可回答「這條式子核對過了嗎」，但無法回答
# 「第 137 頁處理過了嗎」。沒有公式的頁面與尚未處理的頁面，在資料中
# 看起來完全相同——缺少本台帳，漏頁不會被任何機制察覺。
#
# 欄位範例：
#   - pdf_page: 137
#     state: done                 # untouched | in_progress | done | no_content
#     equations: 4
#     note: ""
#
# no_content 用於封面、空白頁、純敘述頁，使其與 untouched 明確區分。
# 本檔可由 tools/ 腳本依 equations/*.yaml 自動初始化，重跑不覆寫人工標註。
#
# ── issues（頁層級，2026-09-25 W1.4 新增）──────────────────────────
# state 記錄處理進度，issues 記錄來源品質，兩者正交：一頁可以既「不可判讀」
# 又「尚未處理」。故不於 state 增設 illegible，改沿用計畫書既有的 issues 機制
# （kind 允許值與公式層級相同，見 CLAUDE.md）。
#
#   - pdf_page: 11
#     state: no_content
#     issues:
#       - kind: illegible
#         note: "來源整頁全黑，內容不可回復（W0.6）"
#
# 本欄為選填。計畫書 5.9 未載此欄，屬 W1.4 期間的追加；因本檔當時為空，
# 新增不需回填既有資料，故非破壞性變更，schema_version 不遞增。

# 以下四筆為 W1.4 目視抽檢的人工標註，非腳本產物。W1.7 的初始化腳本重跑時
# 不得覆寫（見上方說明）。依據：docs/W1.4-逐頁抽檢結果.md

- pdf_page: 11
  state: no_content
  issues:
    - kind: illegible
      note: "來源整頁全黑，內容不可回復。該頁為目錄尾頁（印刷 vii），需另尋來源"

