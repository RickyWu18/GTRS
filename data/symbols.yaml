# 符號字典 — 整個專案的基礎設施
# 依據：計畫書 5.4　│　工項：WBS W2.3–W2.5（G3 前）
#
# 原文沒有全書統一的符號表，而是各 subsystem 章節各附一份。
# scope 不是本專案發明的分類，而是照抄原文的組織方式。
#
# 欄位範例：
#   - key: C_T                    # LaTeX 風格去反斜線與大括號，大小寫不得正規化
#     scope: rotor                # subsystem id，或 global
#     latex: "C_T"                # F1 字串取代之實際依據
#     name_en: thrust coefficient
#     name_zh: 推力係數
#     units: "—"                  # 顯示用
#     dimension: {}               # 選填，機器可讀；無因次以空物件表示
#     source: nomenclature        # nomenclature | inline | inferred
#     defined_in: eq-rotor-4-5
#     fortran: "CT"               # 對應 CR-166535 之變數名（W5.1 批次回填）
#     notes: ""
#
# 禁止為消歧而造原文沒有的 key（如 T_rotor）——消歧一律交由 scope 處理。
#
# ── 5.4.2 的補充規約（2026-09-25，決議 #7，W2.3 開工前定案）────────────
# 計畫書 5.4.2 表列九種形式，實際轉錄時發現四處未涵蓋。以下為補充，
# 與 5.4.2 同位階，違反者 F1／F2 會靜默少掉交叉引用。
#
# 一、重音置於 key 的最末，在所有下標之後
#     5.4.2 只給了無下標的例子（\dot{p} → p_dot）。同時有下標時，
#     下標先、重音後：
#       \ddot{\beta}_m   →  beta_m_ddot      （不是 beta_ddot_m）
#       \ddot{X}_{CG}    →  X_CG_ddot
#
# 二、重音名稱取 LaTeX 巨集名去反斜線
#       \dot → dot    \ddot → ddot    \bar → bar
#       \hat → hat    \tilde → tilde  \vec → vec
#
# 三、撇號比照重音，字尾寫 prime
#     撇號在 TeX 中是上標而非重音，但在本文件中的作用與重音相同（標示變體），
#     故採同一規則：
#       \Omega'_R  →  Omega_R_prime
#       DN'        →  DN_prime
#
# 四、指數不屬於 key
#     U^2 的 key 是 U。指數是施加於符號的運算，不是符號本體的一部分。
#     唯撇號例外（見三），因其標示的是不同的量而非運算。
#
# 五、豎線限定符以 _at_ 連接（決議 #9，2026-09-25 擴充）
#     原文以豎線引入限定符，其後可帶上標（座標系）與下標（條件或作用路徑）。
#     豎線轉為字尾詞 at，限定符依閱讀順序串接——先上標、後下標：
#       I_{XX}\big|_{\beta_m=0}   ->  I_XX_at_beta_m_0     （條件：於短艙角零處取值）
#       U_i\big|^B_{R/WL}         ->  U_i_at_B_R_WL        （座標系 B，作用路徑 R→WL）
#       W_i\big|_{R/WL}           ->  W_i_at_R_WL          （無上標）
#     \big 為尺寸巨集非內容，不進 key。
#     本規則不區分豎線的語意（求值條件／限定符），一律機械套用——需要判斷語意的
#     規則會被判錯，而判錯不會報錯。
#
# 六、斜線、等號、括號索引一律轉為底線或去除（決議 #9）
#       \epsilon_{W/H}     ->  epsilon_W_H      斜線 -> 底線
#       \beta_m=0          ->  beta_m_0         等號去除
#       (X,Y,Z)_{V(i)}     ->  ..._V_i          括號索引 -> 底線
#
# 七、元組展開為各分量，一列寫成多筆（決議 #10）
#     原文常以一列代表二至三個量。展開為各分量，並於每筆 notes 記「原文以元組並列」：
#       (X,Y,Z)_F          ->  X_F、Y_F、Z_F
#       (l,M,N)_R          ->  l_R、M_R、N_R
#       (\Delta X,\Delta Y,\Delta Z)_{LG}  ->  Delta_X_LG、Delta_Y_LG、Delta_Z_LG
#       K_0 \cdots K_4     ->  K_0、K_1、K_2、K_3、K_4
#     理由：公式中出現的是單一分量（如 X_F），不展開則 F1／F2 對 subsystem
#     10a／10b／12／13／14 全面失效——那幾章的符號表幾乎整頁都是元組。
#     展開為機械操作，不涉語意判斷；原文的並列形式由 notes 保存。
#
# 八、分式、偏微商與關係運算子（決議 #11）
#     符號之間的除號轉為字尾詞 over；\partial 取巨集名去反斜線：
#       C_{Y_p}/C_{L_{WP}}                 ->  C_Y_p_over_C_L_WP
#       (SD/q)                             ->  SD_over_q
#       \partial\alpha_{WFS}/\partial\delta_F  ->  partial_alpha_WFS_over_partial_delta_F
#     注意斜線有兩種處理，差別在位置而非語意——下標內的斜線轉底線（規則六），
#     符號之間的除號轉 _over_。由 LaTeX 結構即可判定，不需理解內容。
#
#     關係運算子：= 去除（規則六既有），其餘一律編碼
#       <  ->  _lt_      >  ->  _gt_      <=  ->  _le_      >=  ->  _ge_
#       C_{1_{\delta_a}}|^{\delta_F=0}_{\alpha_{WFS}<8}
#         ->  C_1_delta_a_at_delta_F_0_alpha_WFS_lt_8
#     複合 key（含 _over_）中，重音規則**逐運算元**套用，不是套用於整個 key：
#       \partial\sigma/\partial\hat{p}  ->  partial_sigma_over_partial_p_hat
#     此處 _hat 屬於分母的 p，不屬於整個複合式。若重音在分子，
#     則寫於該運算元之後（... _hat_over_ ...），不得移至 key 末端。
#
#     此處 = 與其他關係的處理不一致，是刻意的取捨：= 為預設關係、不帶區別資訊，
#     去除可讓 key 維持可讀；其餘關係改變意義，不編碼即失真。
#
# 九、status 欄位（決議 #12）
#     計畫書 5.4 的欄位清單未載此欄，但 CLAUDE.md 規則 5 要求一切機器產出標
#     status: draft。無此欄則無法區分機器判讀與已經人眼核對的條目。
#     值域同 9.5：draft（機器輸出）／reviewed（已逐字對照掃描原文）／
#     verified（reviewed ＋ 參照完整性檢查通過 ＋ 無未決 issues）。
#
# 未涵蓋的形式不得自行類推。遇到上列規則裝不下的符號，
# 於該筆 symbols 條目記 issues.kind: schema_gap 並停下來裁定，
# 不要當場發明寫法——命名不一致不會報錯，只會靜默少掉一條交叉引用。
# ──────────────────────────────────────────────────────────────

# ── YAML 引號規約（2026-09-25 實測）────────────────────────────
# latex 等含反斜線的欄位一律用**單引號**。YAML 雙引號會處理跳脫序列，實測：
#     "\beta_m"       → 解析為退格字元 ＋ eta_m   （\b 是退格，靜默竄改，不報錯）
#     "\dot{X}_{CG}"  → 解析錯誤                   （\d 非合法跳脫）
#     '\beta_m'       → 原樣                       ✓
# 計畫書 5.3.1 的範例以雙引號加雙反斜線書寫，本身正確，但漏寫一個反斜線即可能
# 靜默損壞；單引號不需跳脫，轉錄者寫什麼就是什麼。
# 單引號內若出現撇號（如 Omega 的撇號），該撇號須連寫兩個。
# ──────────────────────────────────────────────────────────────

# ── W2.3 轉錄來源與範圍（2026-09-25／26）────────────────────────
# 全部 29 個 subsystem 的符號表頁，共 87 頁，1160 筆。
#
# 來源為各 subsystem 的「符號表頁」——頁首作 `SUBSYSTEM NO. n: ...`，內文為
# Symbol／Description／Units 三欄表。各章開頭的「方框摘要頁」只列 From／To
# Subsystem 與 Symbol、無描述與單位，其內容屬 modules.yaml 的 inputs/outputs
# （W5.2），不在本檔範圍；但已用於逐章核對筆數，確認無漏行。
#
# 本檔全部條目為 status: draft —— 機器判讀，尚未經人眼逐字對照掃描原文。
# 比對工具見 tools/make_data_review.py。
#
# ── 兩項全書性的字形限制（不逐筆標記）────────────────────────
# 一、小寫 l 與數字 1 在本書字體中無法區分。已由兩個獨立的判讀者以 5 倍放大
#     逐像素比對確認：主符號、同列下標中確定的數字 1、單位 ft-lb 中確定的
#     字母 l，三者字形完全相同（同樣的左上旗標與等寬底襯線）。這是字體性質，
#     非個別字元漫漶，**無法由掃描判定**。
# 二、大寫 O 與數字 0、小寫 o 與數字 0 亦有同類疑義。
#
# 處置：符號欄（key／latex）內的歧義字元逐筆標 issues.kind: ocr_uncertain，
# 並於 note 寫出另一種讀法；單位欄與描述欄內的同類字元不逐筆標——否則幾乎
# 每一筆都會帶標記，標記即失去鑑別力。
#
# 最終裁定須另尋依據（附錄 C 的 FORTRAN 變數名、附錄 D 的符號說明列表，
# 或姊妹文件 CR-166535），屬 W2.4／G3 範圍。
#
# ── 符號表頁與方框摘要頁字面不符時，一律以符號表頁為準 ──────────
# 全書出現十餘處，已逐筆記於該條目的 notes 或標 suspected_typo。
# 此慣例由各章轉錄時收斂而得，尚未經正式裁定，待 W2.4 確認。

